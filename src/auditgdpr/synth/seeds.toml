# Hand-written seeds for the fictional world. The LLM expands these into a fact sheet (bible); you review and freeze it.
# Each entity has a `tier`: the lowest clearance that may know about it. Writers only ever see entities <= the doc's tier.

[company]
name = "Acme Corp"
legal_name = "Acme Corp Ltd (EU establishment) / Acme Corp Inc. (parent)"
product = "Acme Beacon"
pitch = "B2B SaaS customer-engagement and analytics platform: CRM, email campaigns, product analytics, and an AI lead-scoring feature."
size = "about 450 employees"
eu_hq = "Dublin, Ireland (Acme Corp Ltd); lead supervisory authority is the Irish Data Protection Commission (DPC)"
parent = "Acme Corp Inc., Austin, Texas, USA"
roles = "Controller for its own customers' account data, employees, website visitors and marketing; processor for its customers' end-user data stored in Beacon."
email_domain = "acme.example"
privacy_contact = "privacy@acme.example"
today = "2026-10-01"
rules = [
  "All email addresses use the acme.example domain.",
  "No real individuals and no real customer companies. Vendors may be well-known infrastructure providers (e.g. AWS eu-west-1, Stripe) but never invent vendor incidents that blame them.",
  "Documents are dated between 2024-01-01 and 2026-10-01.",
]

