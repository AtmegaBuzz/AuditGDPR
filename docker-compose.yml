services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: auditgdpr-postgres
    environment:
      POSTGRES_USER: auditgdpr
      POSTGRES_PASSWORD: auditgdpr
      POSTGRES_DB: auditgdpr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditgdpr -d auditgdpr"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
