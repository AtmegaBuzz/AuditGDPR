services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: auditgdpr-postgres
    environment:
      POSTGRES_USER: auditgdpr
      POSTGRES_PASSWORD: auditgdpr
      POSTGRES_DB: auditgdpr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditgdpr -d auditgdpr"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: auditgdpr-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"      # local dev: plain HTTP on localhost only
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-auditgdpr}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  esdata:
